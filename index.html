<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning JavaScript</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100%;
        width: 100%;
        background-color: rgb(251, 255, 18);
        font-style: initial;
        font-size: 30px;
        text-align: center;
        margin-top: 100px;
        
    }

    #demo {
        margin-top: 100px;
        font: size 20px;
        color: red;

    }

    button {
        height: 70px;
        width: 150px;
        margin-top: 100px;
        border-radius: 20px;
    }

</style>
<body>
    <h1>Learning JavaScript</h1>
    <p id="demo"></p>
    <button onclick="myfunction()">Click</button>
    <script>
        function myfunction(){           
            alert("Hello Aditya!");
            document.getElementById("demo").innerHTML = "Hello Aditya!";
        }
    </script>
</body>
</html>
